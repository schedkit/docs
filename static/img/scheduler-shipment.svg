<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" fill="none" role="img" aria-labelledby="shipment-title shipment-desc">
  <title id="shipment-title">OCI scheduler package arriving at a Linux host</title>
  <desc id="shipment-desc">An isometric parcel labelled OCI sits above a host board. Dashed lines lead to a socket representing sched_ext, with traces connecting it to four CPU cores.</desc>
  <g stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
    <!-- Host chassis: the top plane is a 252-unit square in isometric projection. -->
    <path d="M98 363 350 508 602 363V386L350 531 98 386Z" fill="var(--sk-surface-2, #edeae2)" stroke="var(--sk-line-strong, #9d9990)"/>
    <path d="M350 218 602 363 350 508 98 363Z" fill="var(--sk-bg, #faf9f5)" stroke="var(--sk-line-strong, #9d9990)"/>
    <path d="M350 508v23" stroke="var(--sk-line-strong, #9d9990)"/>

    <!-- Front-panel vents and a status light. -->
    <g transform="matrix(1 .575 0 1 120 383)" stroke="var(--sk-fg-subtle, #716d64)">
      <path d="M0 0h28m7 0h28m7 0h28m7 0h28"/>
      <circle cx="191" cy="0" r="2" fill="var(--sk-accent, #226c9e)" stroke="none"/>
    </g>

    <!-- Board details. All traces and components share the same projection. -->
    <g transform="matrix(1 .575 -1 .575 350 218)">
      <rect x="12" y="12" width="228" height="228" stroke="var(--sk-line, #d7d3c9)"/>
      <g stroke="var(--sk-line-strong, #9d9990)">
        <circle cx="20" cy="20" r="3"/>
        <circle cx="232" cy="20" r="3"/>
        <circle cx="20" cy="232" r="3"/>
        <circle cx="232" cy="232" r="3"/>
        <path d="M20 43h43v25h24M20 51h35v25h32M20 59h27v25h40"/>
        <path d="M35 194h66m-66 9h94m-94 9h94"/>
        <rect x="153" y="186" width="65" height="12"/>
        <rect x="153" y="207" width="65" height="12"/>
        <path d="M159 186v12m8-12v12m8-12v12m8-12v12m8-12v12m8-12v12m8-12v12M159 207v12m8-12v12m8-12v12m8-12v12m8-12v12m8-12v12m8-12v12"/>
      </g>

      <!-- Symbolic sched_ext attachment point. -->
      <rect x="20" y="95" width="80" height="80" fill="var(--sk-surface, #f4f1e9)" stroke="var(--sk-accent, #226c9e)"/>
      <rect x="27" y="102" width="66" height="66" stroke="var(--sk-accent, #226c9e)" stroke-dasharray="3 5"/>
      <rect x="36" y="111" width="48" height="48" fill="var(--sk-accent-tint, #e2edf3)" stroke="var(--sk-accent, #226c9e)"/>
      <g stroke="var(--sk-accent, #226c9e)" stroke-width="3">
        <path d="M44 122h17m6 0h9M44 135h8m6 0h18M44 148h22m6 0h4"/>
      </g>

      <!-- Fan-out from the scheduler to the four cores. -->
      <g stroke="var(--sk-accent, #226c9e)">
        <path d="M100 120h28V62h26M128 62V36h90v10M128 120v6h26M128 126v34h90v-18"/>
        <circle cx="128" cy="120" r="2.5" fill="var(--sk-accent, #226c9e)"/>
      </g>
      <g fill="var(--sk-surface, #f4f1e9)" stroke="var(--sk-fg-muted, #57534c)">
        <rect x="154" y="46" width="32" height="32"/>
        <rect x="202" y="46" width="32" height="32"/>
        <rect x="154" y="110" width="32" height="32"/>
        <rect x="202" y="110" width="32" height="32"/>
        <path d="M162 41v5m8-5v5m8-5v5m-16 32v5m8-5v5m8-5v5M210 41v5m8-5v5m8-5v5m-16 32v5m8-5v5m8-5v5M162 105v5m8-5v5m8-5v5m-16 32v5m8-5v5m8-5v5M210 105v5m8-5v5m8-5v5m-16 32v5m8-5v5m8-5v5"/>
      </g>
      <g fill="var(--sk-accent-tint, #e2edf3)" stroke="var(--sk-accent, #226c9e)">
        <rect x="161" y="53" width="18" height="18"/>
        <rect x="209" y="53" width="18" height="18"/>
        <rect x="161" y="117" width="18" height="18"/>
        <rect x="209" y="117" width="18" height="18"/>
      </g>
    </g>

    <!-- Dashed drop lines locate the package above its destination. -->
    <g stroke="var(--sk-accent, #226c9e)" stroke-dasharray="3 6">
      <path d="M195 174v156M275 220v156M355 174v156"/>
    </g>
    <path d="m189 317 6 13 6-6m68 39 6 13 6-13m68-39 6 6 6-13" stroke="var(--sk-accent, #226c9e)"/>

    <!-- Parcel with the same queue symbol as the attachment point. -->
    <path d="M195 94 275 140v80l-80-46Z" fill="var(--sk-surface, #f4f1e9)" stroke="var(--sk-accent, #226c9e)"/>
    <path d="m275 140 80-46v80l-80 46Z" fill="var(--sk-accent-tint, #e2edf3)" stroke="var(--sk-accent, #226c9e)"/>
    <path d="m275 48 80 46-80 46-80-46Z" fill="var(--sk-bg, #faf9f5)" stroke="var(--sk-accent, #226c9e)"/>
    <g transform="matrix(1 .575 -1 .575 275 48)" stroke="var(--sk-accent, #226c9e)">
      <path d="M0 8h80M0 72h80" stroke-dasharray="2 4"/>
      <rect x="19" y="19" width="42" height="42" fill="var(--sk-accent-tint, #e2edf3)"/>
      <g stroke-width="3">
        <path d="M26 29h13m6 0h9M26 40h8m6 0h14M26 51h20m6 0h2"/>
      </g>
    </g>
    <g transform="matrix(1 .575 0 1 207 131)" fill="var(--sk-accent, #226c9e)" stroke="none" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
      <text font-size="19" letter-spacing="2">OCI</text>
      <text y="20" font-size="8">schedkit</text>
    </g>
    <g transform="matrix(1 -.575 0 1 294 161)" stroke="var(--sk-accent, #226c9e)">
      <path d="M0 0v-20m-4 4 4-4 4 4M13 0v-20m-4 4 4-4 4 4"/>
      <path d="M0 12v10m4-10v10m3-10v10m6-10v10m3-10v10m3-10v10m5-10v10m4-10v10"/>
    </g>

    <!-- Labels sit outside the drawing and remain horizontal. -->
    <g stroke="var(--sk-fg-subtle, #716d64)">
      <path d="m355 94 45-26h115"/>
      <path d="M195 330h-58l-31-31H35"/>
      <path d="m530 354 37-21h48"/>
      <path d="M434 483v44h103"/>
      <path d="M173 240h22"/>
    </g>
    <g fill="var(--sk-fg-muted, #57534c)" stroke="none" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">
      <text x="515" y="57" text-anchor="end">OCI scheduler</text>
      <text x="35" y="289">sched_ext</text>
      <text x="615" y="322" text-anchor="end">CPU cores</text>
      <text x="537" y="546" text-anchor="end">Linux host</text>
      <text x="163" y="237" text-anchor="end" font-size="11">verify + start</text>
    </g>
  </g>
</svg>
